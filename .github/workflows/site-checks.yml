name: Website checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check generated website and JavaScript
        run: |
          python3 scripts/check_site.py
          node --check assets/site.js
      - name: Verify reproducible pages
        run: |
          python3 scripts/build.py
          git diff --exit-code
