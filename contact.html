<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FeverDream - Contact Us</title>
    <meta name="description"
        content="Contact FeverDream for AI solutions, cloud services, and security consultations. Let's build the future together.">
    <meta name="keywords" content="Contact FeverDream, AI Consultation, Tech Support, Sales, FeverDream Location">
    <meta name="robots" content="index, follow">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="contact-styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Poppins:wght@300;400;600;700&display=swap"
        rel="stylesheet">
</head>

<body class="contact-theme">
    <header>
        <div class="header-content">
            <div class="logo-section">
                <a href="index.html" class="logo-container">
                    <img src="FEVER DREAM.png" alt="FEVERDREAM Logo" class="logo-img">
                    <h1 class="site-title">FEVERDREAM</h1>
                </a>
            </div>
            <nav class="nav-bar">
                <a href="ai.html" class="nav-button">AI</a>
                <a href="cloud.html" class="nav-button">Cloud</a>
                <a href="dev.html" class="nav-button">DEV</a>
                <a href="security.html" class="nav-button">Security</a>
                <a href="projects.html" class="nav-button">Projects</a>
                <a href="about.html" class="nav-button">About</a>
                <a href="contact.html" class="nav-button active">Contact</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="hero contact-hero">
            <h1>Get in <span class="gradient-text">Touch</span></h1>
            <p class="tagline">Begin Your Digital Transformation</p>
        </section>

        <section class="contact-container">
            <div class="contact-grid">
                <!-- Contact Info Card -->
                <div class="contact-card info-card">
                    <h2>Contact Information</h2>
                    <div class="info-item">
                        <i class="fas fa-envelope"></i>
                        <div>
                            <h3>Email Us</h3>
                            <a href="mailto:vendas@feverdream.dev">vendas@feverdream.dev</a>
                        </div>
                    </div>
                    <div class="info-item">
                        <i class="fas fa-phone"></i>
                        <div>
                            <h3>Call Us</h3>
                            <a href="tel:+5511999995766">+55 11 99999-5766</a>
                        </div>
                    </div>
                    <div class="info-item">
                        <i class="fas fa-map-marker-alt"></i>
                        <div>
                            <h3>Location</h3>
                            <p>Sao Paulo, Brazil</p>
                        </div>
                    </div>
                    <div class="social-connect">
                        <h3>Follow Us</h3>
                        <div class="social-icons">
                            <a href="https://instagram.com/feverdream.dev" target="_blank"><i
                                    class="fab fa-instagram"></i></a>
                            <a href="https://br.linkedin.com/company/feverdreamdev" target="_blank"><i
                                    class="fab fa-linkedin"></i></a>
                            <a href="https://github.com/zarigata" target="_blank"><i class="fab fa-github"></i></a>
                        </div>
                    </div>
                </div>

                <!-- Message Form (Visual Only for now, mailto fallback) -->
                <div class="contact-card form-card">
                    <h2>Send a Message</h2>
                    <form action="mailto:vendas@feverdream.dev" method="post" enctype="text/plain" class="contact-form">
                        <div class="form-group">
                            <input type="text" name="name" required placeholder="Your Name">
                        </div>
                        <div class="form-group">
                            <input type="email" name="email" required placeholder="Your Email">
                        </div>
                        <div class="form-group">
                            <select name="interest">
                                <option value="" disabled selected>I'm interested in...</option>
                                <option value="AI Solutions">AI Solutions</option>
                                <option value="Cloud Services">Cloud Services</option>
                                <option value="Development">Development</option>
                                <option value="Security">Security</option>
                                <option value="Fever Education">Fever Education</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <textarea name="message" rows="5" required placeholder="Your Message"></textarea>
                        </div>
                        <button type="submit" class="submit-btn">Send Message <i
                                class="fas fa-paper-plane"></i></button>
                    </form>
                </div>
            </div>
        </section>

        <section class="animated-background">
            <div class="particles"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
